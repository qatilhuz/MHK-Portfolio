<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk profile avatar</title>
  <desc id="desc">A high-contrast luminous cyberpunk operator avatar designed to convert cleanly into Braille characters.</desc>
  <defs>
    <linearGradient id="hood" x1="188" y1="112" x2="580" y2="682" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.46" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="suit" x1="188" y1="460" x2="580" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="aura" cx="384" cy="342" r="315" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.45"/>
      <stop offset="0.52" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020202" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.83  0 0 0 0 1  0 0 0 0.9 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="768" height="768" fill="#020202"/>
  <circle cx="384" cy="338" r="318" fill="url(#aura)"/>

  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 698c18-112 87-187 196-187 108 0 178 75 196 187H188Z" fill="url(#suit)" stroke="#e0f2fe" stroke-width="10"/>
    <path d="M296 501c12-65 43-97 88-97s76 32 88 97c-24 26-52 39-88 39s-64-13-88-39Z" fill="#f8fafc" stroke="#67e8f9" stroke-width="9"/>

    <path d="M202 410c0-126 76-226 182-226s182 100 182 226c0 38-9 72-25 101-25-29-62-47-102-55-18-4-36-6-55-6s-37 2-55 6c-40 8-77 26-102 55-16-29-25-63-25-101Z" fill="url(#hood)" stroke="#e0f2fe" stroke-width="10"/>
    <path d="M265 367c2-86 50-149 119-149 68 0 117 63 119 149 1 68-48 116-119 116-71 0-120-48-119-116Z" fill="#f8fafc" stroke="#0891b2" stroke-width="8"/>

    <rect x="279" y="326" width="210" height="70" rx="35" fill="#02121b" stroke="#67e8f9" stroke-width="8"/>
    <path d="M313 361h51l14 0m72 0h51" stroke="#f8fafc" stroke-width="9"/>
    <path d="M327 424c32 25 82 25 114 0" stroke="#0284c7" stroke-width="8"/>

    <path d="M290 254c-38 23-63 68-66 123m188-123c38 23 63 68 66 123" stroke="#0891b2" stroke-width="8"/>
    <path d="M384 171v-45m0 0c0-23 17-39 39-39" stroke="#7dd3fc" stroke-width="7"/>
    <circle cx="427" cy="87" r="8" fill="#f8fafc"/>

    <path d="M252 585h48l42 42 42-42h48" stroke="#f8fafc" stroke-width="8"/>
    <path d="M384 626v-61" stroke="#f8fafc" stroke-width="8"/>
    <path d="M236 658h-61m357 0h61" stroke="#7dd3fc" stroke-width="8"/>
    <path d="M229 537l-48 48m310-48 48 48" stroke="#67e8f9" stroke-width="7"/>
  </g>
